<!doctype html>
<html lang="en" data-product-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211a13" />
    <script>
      try {
        var productImageMode = localStorage.getItem('product-image-mode')
        document.documentElement.dataset.productMode =
          productImageMode === 'dark' ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.productMode = 'light'
      }
    </script>
    <meta
      name="description"
      content="Lamp and Glow — handcrafted wooden lamps and sculptural lighting, made for the hour after sunset."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Lamp &amp; Glow — Handcrafted Wooden Lamps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
